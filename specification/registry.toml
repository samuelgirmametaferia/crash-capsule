# Crash Capsule field and privacy registry (normative, machine-readable).
#
# This file is the single source of truth for:
#   * the integer keys used on the wire,
#   * the MINIMUM privacy class of every standard field,
#   * profile size budgets and the maximum privacy class each profile may carry.
#
# `crates/cc-schema/build.rs` generates Rust constants and lookup tables from this
# file, so the registry and the implementation cannot drift. Producers may RAISE a
# field's class but never lower it:
#
#     effective_class = max(schema_minimum_class, producer_declared_class)
#
# Adding a field is a `schema_minor` change. Changing a key, a type or lowering a
# class is a `schema_major` change and requires new test vectors in the same PR.

schema_major = 1
schema_minor = 0

# ---------------------------------------------------------------------------
# Privacy classes
# ---------------------------------------------------------------------------

[[class]]
id = 0
name = "P0"
label = "Public diagnostic"
description = "Normally safe to disclose: schema version, failure class, versions, function names."

[[class]]
id = 1
name = "P1"
label = "Pseudonymous / low-risk diagnostic"
description = "Can contribute to fingerprinting or device profiling: coarse hardware IDs, module set, distro, taint."

[[class]]
id = 2
name = "P2"
label = "Personal-context risk"
description = "Likely to identify user or system: hostnames, IP addresses, user paths, process arguments. Redacted or tokenised by default."

[[class]]
id = 3
name = "P3"
label = "Secret-risk data"
description = "May contain credentials or private content: environment, arbitrary log text, headers. Omitted unless explicitly justified."

[[class]]
id = 4
name = "P4"
label = "Restricted artifact"
description = "Essentially uncontrolled memory or content: core dumps, process memory, full journals. Never optical by default."

# ---------------------------------------------------------------------------
# Profiles
#
# `max_bytes` applies AFTER redaction and compression but BEFORE outer FEC.
# `max_class` is the highest effective class a field may carry and still be
# emitted under the profile; anything above is dropped by the evidence budget.
# ---------------------------------------------------------------------------

[[profile]]
id = 0
name = "panic-minimal"
target_bytes = 1536
max_bytes = 2560
max_class = "P1"
description = "One static QR rendered from panic context."

[[profile]]
id = 1
name = "visual-small"
target_bytes = 4096
max_bytes = 8192
max_class = "P1"
description = "Fast multi-pass optical transfer."

[[profile]]
id = 2
name = "visual-standard"
target_bytes = 12288
max_bytes = 16384
max_class = "P1"
description = "Default rich optical report."

[[profile]]
id = 3
name = "visual-extended"
target_bytes = 32768
max_bytes = 32768
max_class = "P2"
description = "Explicitly slower optical capture."

[[profile]]
id = 4
name = "local-full"
target_bytes = 262144
max_bytes = 262144
max_class = "P3"
description = "Disk or network transport only; never rendered optically."

